{% extends 'base.html' %}
{% block title %}Register — CivicConnect{% endblock %}
{% block content %}
<div class="form-wrap">
    <div class="form-card" style="max-width:520px;">
        <div class="card card-body">
            <div style="text-align:center;margin-bottom:2rem;">
                <div style="font-size:2.5rem;margin-bottom:0.5rem;"><i class="fa-solid fa-user-plus" style="color:var(--primary);"></i></div>
                <h2 style="font-size:1.5rem;font-weight:800;">Join CivicConnect</h2>
                <p style="color:var(--text3);font-size:0.88rem;margin-top:0.3rem;">Become a civic change-maker</p>
            </div>
            {% for msg in messages %}<div class="alert alert-error"><i class="fa-solid fa-circle-exclamation"></i> {{ msg }}</div>{% endfor %}
            <form method="post">
                {% csrf_token %}
                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" name="full_name" class="form-control" placeholder="Your full name" autofocus>
                </div>
                <div class="form-group">
                    <label>Username</label>
                    <input type="text" name="username" class="form-control" required placeholder="Choose a username">
                </div>
                <div class="form-group">
                    <label>Email <span style="color:var(--text3);font-weight:400;">(optional)</span></label>
                    <input type="email" name="email" class="form-control" placeholder="your@email.com">
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <div style="position:relative;">
                        <input type="password" name="password" id="regPass" class="form-control" required placeholder="Min 8 characters" style="padding-right:2.75rem;">
                        <button type="button" onclick="togglePass('regPass','regPassIcon')" style="position:absolute;right:0.75rem;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:var(--text3);font-size:1rem;padding:0;">
                            <i id="regPassIcon" class="fa-solid fa-eye"></i>
                        </button>
                    </div>
                </div>
                <button type="submit" class="btn btn-primary btn-block" style="margin-top:0.5rem;">Create Account</button>
            </form>
            <p style="text-align:center;margin-top:1.25rem;font-size:0.88rem;color:var(--text3);">
                Already have an account? <a href="{% url 'login' %}" style="color:var(--primary);font-weight:600;">Login</a>
            </p>
        </div>
    </div>
</div>
{% endblock %}
{% block extra_js %}
<script>
function togglePass(inputId, iconId) {
    const input = document.getElementById(inputId);
    const icon = document.getElementById(iconId);
    if (input.type === 'password') {
        input.type = 'text';
        icon.className = 'fa-solid fa-eye-slash';
    } else {
        input.type = 'password';
        icon.className = 'fa-solid fa-eye';
    }
}
</script>
{% endblock %}
